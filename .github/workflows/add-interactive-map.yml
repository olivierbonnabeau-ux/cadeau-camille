name: Add interactive travel map
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  map:
    if: github.event.head_commit.message != 'feat: add interactive travel map'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insert map below Le programme
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('templates/index.html')
          s=p.read_text(encoding='utf-8')
          if 'id="travel-map"' in s:
              print('Map already present')
              raise SystemExit
          css='''\n<style>\n#travel-map{height:620px;border-radius:24px;overflow:hidden;border:1px solid var(--line);box-shadow:0 12px 35px #0005;background:#102532}#travel-map .leaflet-popup-content{color:#12232c;font-family:Inter,system-ui,sans-serif}.map-legend{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:0 auto 18px}.map-filter{border:1px solid var(--line);border-radius:999px;padding:8px 13px;background:#102532;color:var(--text);font-weight:800;cursor:pointer}.map-filter.active{background:#d9f7ff;color:#08202c;border-color:#d9f7ff}.map-note{text-align:center;color:var(--muted);font-size:13px;margin:14px auto 0;max-width:850px}.leaflet-control-layers{border-radius:12px!important}.leaflet-control-layers label{color:#102532}\n@media(max-width:650px){#travel-map{height:520px}}\n</style>\n<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIINfQ3P5nY3t7kL2wYQ8n4Xh5m5m5m5m5m=" crossorigin=""/>\n'''
          # Use a trusted CDN stylesheet without integrity so the page keeps working if the CDN changes its hash.
          css=css.replace(' integrity="sha256-p4NxAoJBhIINfQ3P5nY3t7kL2wYQ8n4Xh5m5m5m5m5m="','')
          marker='<section><h2 class="sectiontitle">🗓️ Le programme</h2>'
          insert_after='''</section>\n<section>'''
          # Add Leaflet CSS before </head>.
          s=s.replace('</head>',css+'</head>',1)
          program_end='''</section>\n<section><h2 class="sectiontitle">💰 Où va le cadeau ?</h2>'''
          map_section='''</section>\n<section id="carte-voyage"><h2 class="sectiontitle">🗺️ La carte du voyage</h2><p class="intro">Visualisez les vols, les traversées en bateau et les hébergements de l’aventure. Cliquez sur les points pour voir les détails.</p><div class="map-legend"><button class="map-filter active" data-layer="all">Tout afficher</button><button class="map-filter active" data-layer="flight">✈️ Avion</button><button class="map-filter active" data-layer="boat">⛴️ Bateau</button><button class="map-filter active" data-layer="hotel">🏨 Hôtels</button><button class="map-filter active" data-layer="bus">🚌 Bus</button></div><div id="travel-map"></div><p class="map-note">📍 Les trajets aériens sont représentés de façon schématique entre les aéroports ; les tracés bateau et bus suivent les étapes du programme.</p></section>\n<section><h2 class="sectiontitle">💰 Où va le cadeau ?</h2>'''
          if program_end not in s:
              raise SystemExit('Programme section boundary not found')
          s=s.replace(program_end,map_section,1)
          js='''\n<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>\ndocument.addEventListener('DOMContentLoaded',function(){\n  const mapEl=document.getElementById('travel-map'); if(!mapEl||typeof L==='undefined')return;\n  const map=L.map('travel-map',{scrollWheelZoom:false}).setView([65,14],4.4);\n  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);\n  const layers={flight:L.layerGroup(),boat:L.layerGroup(),hotel:L.layerGroup(),bus:L.layerGroup()};\n  const coords={Paris:[49.0097,2.5479],Tromso:[69.6833,18.9189],Bodo:[67.2804,14.4049],Moskenes:[67.8986,13.0464],Sakrisoy:[67.8969,13.0167],Reine:[67.9325,13.0896],Hamny:[67.9498,13.0398],A:[67.8796,12.9823],Oslo:[59.9111,10.7528]};\n  function pin(icon,title,html,group){return L.marker(coords[title],{title:title}).bindPopup('<b>'+icon+' '+title+'</b><br>'+html).addTo(group)}\n  pin('✈️','Paris','Aéroport CDG<br><small>Départ 7 jan. 09:10 · retour 17 jan. 11:25</small>',layers.flight);\n  pin('✈️','Tromso','Aéroport TOS<br><small>Arrivée 7 jan. · départ vers Bodø 11 jan. 11:40</small>',layers.flight);\n  pin('✈️','Bodo','Aéroport BOO<br><small>Arrivée 11 jan. 12:40 · départ vers Oslo 14 jan. 17:50</small>',layers.flight);\n  pin('✈️','Oslo','Aéroport OSL<br><small>Arrivée 14 jan. 19:20 · retour Paris 17 jan. 09:00</small>',layers.flight);\n  const flight1=L.polyline([coords.Paris,coords.Tromso],{weight:3,dashArray:'9 8'}).bindPopup('<b>✈️ Paris → Tromsø</b><br>7 jan. · 09:10–13:05');\n  const flight2=L.polyline([coords.Tromso,coords.Bodo],{weight:3,dashArray:'9 8'}).bindPopup('<b>✈️ Tromsø → Bodø</b><br>11 jan. · 11:40–12:40');\n  const flight3=L.polyline([coords.Bodo,coords.Oslo],{weight:3,dashArray:'9 8'}).bindPopup('<b>✈️ Bodø → Oslo</b><br>14 jan. · 17:50–19:20');\n  const flight4=L.polyline([coords.Oslo,coords.Paris],{weight:3,dashArray:'9 8'}).bindPopup('<b>✈️ Oslo → Paris</b><br>17 jan. · 09:00–11:25');\n  [flight1,flight2,flight3,flight4].forEach(x=>x.addTo(layers.flight));\n  L.polyline([coords.Bodo,coords.Moskenes],{weight:5}).bindPopup('<b>⛴️ Bodø → Moskenes</b><br>11 jan. · 16:00–20:00').addTo(layers.boat);\n  L.polyline([coords.Moskenes,coords.Bodo],{weight:5}).bindPopup('<b>⛴️ Moskenes → Bodø</b><br>14 jan. · 08:00–11:15').addTo(layers.boat);\n  L.circleMarker(coords.Tromso,{radius:9,weight:3}).bindPopup('<b>🐋 MV Quest</b><br>Croisière safari baleine + aurores<br>9 jan. 19:00 → 10 jan. ~18:00–19:00').addTo(layers.boat);\n  pin('🏨','Tromso','SmartHotel Tromsø<br><small>7–9 jan. · 2 nuits</small>',layers.hotel);\n  const city=L.marker([69.6489,18.956]).bindPopup('<b>🏨 City Living Tromsø</b><br><small>10–11 jan. · 1 nuit</small>').addTo(layers.hotel);\n  const sak=L.marker(coords.Sakrisoy).bindPopup('<b>🏨 Sakrisøy Gjestegård</b><br><small>11–13 jan. · 2 nuits · King Room with Side Sea View</small>').addTo(layers.hotel);\n  const cabin=L.marker(coords.A).bindPopup('<b>🛖 Cabin 1 · Å i Lofoten</b><br><small>13–14 jan. · studio avec kitchenette</small>').addTo(layers.hotel);\n  const oslo=L.marker(coords.Oslo).bindPopup('<b>🏨 Appartement · Oslo</b><br><small>14–17 jan. · 3 nuits · près d’Oslo S</small>').addTo(layers.hotel);\n  L.polyline([coords.A,coords.Moskenes],{weight:3,dashArray:'5 7'}).bindPopup('<b>🚌 Å → Moskenes</b><br>14 jan. · 06:25–06:35').addTo(layers.bus);\n  [['Sakrisoy','Sakrisøy · étape hébergement'],['Reine','Reine · 12 jan.'],['Hamny','Hamnøy · 12 jan.'],['A','Å · 13–14 jan.']].forEach(([k,t])=>L.circleMarker(coords[k],{radius:6}).bindPopup('<b>🚌 '+t+'</b>').addTo(layers.bus));\n  Object.values(layers).forEach(x=>x.addTo(map));\n  const buttons=document.querySelectorAll('.map-filter');\n  buttons.forEach(btn=>btn.addEventListener('click',()=>{const key=btn.dataset.layer;if(key==='all'){Object.values(layers).forEach(x=>map.addLayer(x));buttons.forEach(b=>b.classList.add('active'));return;}const isOn=map.hasLayer(layers[key]);if(isOn){map.removeLayer(layers[key]);btn.classList.remove('active')}else{map.addLayer(layers[key]);btn.classList.add('active')}const allOn=Object.values(layers).every(x=>map.hasLayer(x));document.querySelector('[data-layer="all"]').classList.toggle('active',allOn)}));\n  setTimeout(()=>map.invalidateSize(),250);\n});\n</script>\n'''
          s=s.replace('</body>',js+'</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit map
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add templates/index.html .github/workflows/add-interactive-map.yml
          git commit -m 'feat: add interactive travel map'
          git push
