name: Change title
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/change-title.yml'
permissions:
  contents: write
jobs:
  update-title:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update title
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('templates/index.html')
          s = p.read_text(encoding='utf-8')
          old = '<h1>CADEAU 30 ANS CAMILLE</h1><p style="font-size:26px;color:var(--text);font-weight:800;margin-top:22px">L\'aventure commence à 70° Nord</p>'
          new = '<h1>CADEAU 30 ANS CAMILLE</h1><p style="font-size:26px;color:var(--text);font-weight:800;margin:18px 0 6px">Un Voyage dans le grand nord Norvégien</p><p style="font-size:30px;color:var(--text);font-weight:900;margin:0 0 22px">L\'aventure commence à 70° Nord</p>'
          if old not in s:
              raise SystemExit('Titre actuel introuvable')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add templates/index.html
          git commit -m 'Modifie les titres du cadeau Camille'
          git push
          rm -f .github/workflows/change-title.yml
          git add .github/workflows/change-title.yml
          git commit -m 'Supprime le workflow temporaire de titre'
          git push
