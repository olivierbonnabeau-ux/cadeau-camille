name: Fix admin delete pledge
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix admin form fields
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('templates/admin.html')
          s = p.read_text()
          s2 = s.replace('name="action" value="delete"','name="action" value="delete_pledge"').replace('name="id" value="{{p.id}}"','name="pledge_id" value="{{p.id}}"')
          if s2 == s:
              print('No changes needed')
          else:
              p.write_text(s2)
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add templates/admin.html
          git diff --cached --quiet || git commit -m 'Fix admin delete pledge form'
          git push
      - name: Remove workflow
        run: |
          git rm .github/workflows/fix-admin-delete.yml || true
          git diff --cached --quiet || git commit -m 'Remove temporary admin delete workflow'
          git push || true