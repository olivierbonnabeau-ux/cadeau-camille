name: Fix carousels and donation categories
on:
  push:
    paths:
      - '.github/workflows/fix-carousels-categories.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch frontend
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('templates/index.html')
          s=p.read_text(encoding='utf-8')
          if 'frontend-repair-v2' not in s:
              inject=r'''<div id="frontend-repair-v2"></div><style>
          .repair-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.repair-card{background:rgba(16,37,50,.9);border:1px solid var(--line);border-radius:20px;overflow:hidden}.repair-gallery{position:relative;aspect-ratio:1/1;background:#07131d;overflow:hidden}.repair-gallery img{display:none;width:100%;height:100%;object-fit:cover}.repair-gallery img.active{display:block}.repair-gallery button{position:absolute;top:50%;transform:translateY(-50%);width:34px;height:34px;border:0;border-radius:50%;background:#07131dcc;color:#fff;font-size:22px;cursor:pointer;z-index:2}.repair-gallery .prev{left:9px}.repair-gallery .next{right:9px}.repair-dots{position:absolute;bottom:8px;left:0;right:0;text-align:center}.repair-dots i{display:inline-block;width:7px;height:7px;border-radius:50%;background:#ffffff77;margin:0 3px}.repair-dots i.active{background:#fff}.repair-body{padding:16px}.repair-body h3{font-size:18px;line-height:1.2;margin:0 0 8px}.repair-body p{color:var(--muted);font-size:14px;line-height:1.45}.repair-btn{width:100%;border:0;border-radius:11px;padding:10px;background:#d9f7ff;color:#08202c;font-weight:800;cursor:pointer}@media(max-width:900px){.repair-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){.repair-grid{grid-template-columns:1fr}}
          </style><script>
          (function(){
          const DATA={
          'Avion':['/static/images/avion.png'],
          'Tromsø':['/static/images/tromso.png','/static/images/tromso_01.jpeg','/static/images/tromso_02.jpeg'],
          'Croisière Aurore Boréale et Safari Baleine':['/static/images/quest.png','/static/images/orca.png','/static/images/aurora.png'],
          'Les îles Lofoten':['/static/images/lofoten.png','/static/images/lofoten_01.jpeg','/static/images/lofoten_02.jpeg'],
          "S'endormir sous les aurores boréales dans des cabanes au bout du monde":['/static/images/cabin.png','/static/images/cabane_aa_01.jpeg','/static/images/cabane_aa_02.jpeg','/static/images/cabane_aa_03.jpeg'],
          'Traversée Bodø → Moskenes':['/static/images/ferry.png'],
          'Oslo':['/static/images/oslo_palace.png','/static/images/oslo_port.png'],
          'Repas & gourmandises':['/static/images/waffles.png','/static/images/kanelboller.png','/static/images/lefse.png','/static/images/rommegrot.png','/static/images/lefse_savory.png','/static/images/sandwich.png','/static/images/potatoes_mushrooms.png']};
          function esc(x){return String(x||'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
          function name(x){return String(x||'').replace(/^\W+/, '').trim();}
          function gallery(box,imgs,title){let n=0;box.className='repair-gallery';imgs.forEach((src,i)=>{let im=document.createElement('img');im.src=src;im.alt=title;if(!i)im.className='active';box.appendChild(im)});if(imgs.length>1){let a=document.createElement('button');a.className='prev';a.textContent='‹';let b=document.createElement('button');b.className='next';b.textContent='›';let dots=document.createElement('div');dots.className='repair-dots';imgs.forEach((_,i)=>{let d=document.createElement('i');if(!i)d.className='active';d.onclick=()=>go(i);dots.appendChild(d)});box.append(a,b,dots);function go(i){n=(i+imgs.length)%imgs.length;box.querySelectorAll('img').forEach((x,j)=>x.classList.toggle('active',j===n));box.querySelectorAll('i').forEach((x,j)=>x.classList.toggle('active',j===n));}a.onclick=()=>go(n-1);b.onclick=()=>go(n+1);}}
          function restoreCards(){document.querySelectorAll('.activity-card').forEach(card=>{let h=card.querySelector('h3');if(!h)return;let t=name(h.textContent);let imgs=DATA[t];if(!imgs||imgs.length<2)return;let old=card.querySelector('.media,.gallery');if(!old||old.dataset.repaired)return;let box=document.createElement('div');box.dataset.repaired='1';gallery(box,imgs,t);old.replaceWith(box);});}
          function restoreCategories(){let form=document.querySelector('form[action="/pledge"],form[action$="/pledge"]');if(!form||document.getElementById('repair-categories'))return;let sec=document.createElement('section');sec.id='repair-categories';sec.innerHTML='<h2 class="sectiontitle">🎁 Choisissez votre participation</h2><p class="intro">Choisissez la catégorie que vous souhaitez aider à financer.</p><div class="repair-grid"></div>';let grid=sec.querySelector('.repair-grid');let opts=[...document.querySelectorAll('select[name="activity_id"] option')];Object.entries(DATA).forEach(([t,imgs])=>{if(t==='Croisière Aurore Boréale et Safari Baleine')return;let o=opts.find(x=>name(x.textContent)===name(t));let card=document.createElement('article');card.className='repair-card';let box=document.createElement('div');gallery(box,imgs,t);card.appendChild(box);let body=document.createElement('div');body.className='repair-body';body.innerHTML='<h3>'+esc(t)+'</h3><p>'+(o?esc(o.dataset.description||''):'')+'</p><button class="repair-btn" type="button">Choisir cette catégorie</button>';card.appendChild(body);body.querySelector('button').onclick=()=>{if(o){let sel=document.querySelector('select[name="activity_id"]');sel.value=o.value;sel.dispatchEvent(new Event('change',{bubbles:true}));form.scrollIntoView({behavior:'smooth',block:'center'});}};grid.appendChild(card)});form.parentNode.insertBefore(sec,form.nextSibling);}
          document.addEventListener('DOMContentLoaded',()=>{restoreCards();restoreCategories();});
          })();</script>'''
              s=s.replace('</body>',inject+'</body>',1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add templates/index.html
          git commit -m "Restore carousels and donation category display"
          git push
          git rm .github/workflows/fix-carousels-categories.yml
          git commit -m "Remove temporary frontend repair workflow"
          git push
