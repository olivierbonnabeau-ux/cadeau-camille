name: Fix dynamic remaining amount
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-dynamic-remaining.yml'

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch display
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('templates/index.html')
          s = p.read_text()
          old = "{% set goal_value=1531.5 %}<div class=\"goal\"><div class=\"goalrow\"><b>{{'%.0f'|format(total)}} € promis</b><span>reste à charge pour Camille {{'%.0f'|format(goal_value)}} €</span></div><div class=\"bar\"><div class=\"fill\" style=\"--w:{{[total/goal_value*100,100]|min}}%\"></div></div></div>"
          new = "{% set goal_value=1532 %}{% set remaining=[goal_value-total,0]|max %}<div class=\"goal\"><div class=\"goalrow\"><b>{{'%.0f'|format(total)}} € promis</b><span>reste à charge pour Camille {{'%.0f'|format(remaining)}} €</span></div><div class=\"bar\"><div class=\"fill\" style=\"--w:{{[total/goal_value*100,100]|min}}%\"></div></div></div>"
          if old not in s:
              raise SystemExit('Expected goal block not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Set backend goal to 1532
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app.py')
          s = p.read_text()
          old = "    goal = 1531.5"
          new = "    goal = 1532"
          if old in s:
              p.write_text(s.replace(old, new, 1))
          else:
              print('Backend goal already changed or not found')
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py templates/index.html
          git diff --cached --quiet || git commit -m 'Make remaining amount dynamic'
          git push
      - name: Remove workflow
        if: always()
        run: |
          rm -f .github/workflows/fix-dynamic-remaining.yml
          git add -A
          git diff --cached --quiet || git commit -m 'Remove temporary fix workflow'
          git push