name: Fix missing image_for

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore image_for context
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app.py')
          s = p.read_text(encoding='utf-8')
          old = "return render_template('index.html', activities=activities, total=total, goal=goal, images_for=images_for, promises=PROMISES)"
          new = "return render_template('index.html', activities=activities, total=total, goal=goal, image_for=lambda a: images_for(a)[0], images_for=images_for, promises=PROMISES)"
          if old not in s:
              raise SystemExit('Expected render_template line not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
          python -m py_compile app.py
      - name: Commit fix and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git commit -m "Fix missing image_for template helper"
          git rm .github/workflows/fix-image-for.yml
          git commit -m "Remove temporary image_for workflow"
          git push
