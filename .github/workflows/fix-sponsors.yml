name: Affiche le programme sponsorisé
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corriger les fiches sans message
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('templates/index.html')
          s=p.read_text(encoding='utf-8')
          pattern=r'<section><h2 class="sectiontitle">💌 Les petits mots pour Camille</h2>.*?</section>\n<section><h2 class="sectiontitle">💰 Où va le cadeau \?</h2>'
          replacement='''<section><h2 class="sectiontitle">💌 Les petits mots pour Camille</h2>{% if messages %}<div class="messages">{% for p in messages %}<article class="message{% if not p.message %} no-message{% endif %">{% if p.message %}<div class="quote">{{p.message}}</div>{% endif %}<div class="from">❤️ {{p.name}}</div>{% if p.activity %}<div class="tag">Sponsor de : {{p.activity.emoji}} {{p.activity.title}}</div>{% endif %}</article>{% endfor %}</div>{% else %}<div class="empty">Le premier petit mot pour Camille sera bientôt là… ❤️</div>{% endif %}</section>
<section><h2 class="sectiontitle">💰 Où va le cadeau ?</h2>'''
          s2,n=re.subn(pattern,replacement,s,count=1,flags=re.S)
          assert n==1, 'Section des petits mots introuvable'
          p.write_text(s2,encoding='utf-8')
          PY
      - name: Commit et supprimer le workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add templates/index.html .github/workflows/fix-sponsors.yml
          git commit -m 'Affiche le programme sponsorisé pour chaque participant'
          git rm .github/workflows/fix-sponsors.yml
          git commit -m 'Supprime le workflow temporaire'
          git push
