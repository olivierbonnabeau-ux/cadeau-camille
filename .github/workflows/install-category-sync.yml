name: Install category sync
on:
  push:
    branches: [main]
jobs:
  patch:
    if: github.event.head_commit.message != 'Install category sync script'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Add script to homepage
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('templates/index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="/static/category-sync.js"></script>'
          if tag not in s:
              s=s.replace('</body>', tag+'</body>')
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add templates/index.html
          git diff --cached --quiet || git commit -m 'Install category sync script'
          git push
      - name: Remove workflow
        if: success()
        run: |
          rm -f .github/workflows/install-category-sync.yml
          git add .github/workflows/install-category-sync.yml
          git commit -m 'Remove temporary category sync workflow' || true
          git push || true
