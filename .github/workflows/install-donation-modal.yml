name: Install donation success modal
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install script
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('templates/index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="/static/donation-success-modal.js"></script>'
          if tag not in s:
              marker = '</body>'
              if marker not in s:
                  raise SystemExit('Missing </body> in index.html')
              s = s.replace(marker, tag + marker, 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add templates/index.html
          git diff --cached --quiet || git commit -m 'Show donation confirmation in modal'
          git push
      - name: Remove workflow
        if: always()
        run: |
          git rm .github/workflows/install-donation-modal.yml || true
          git diff --cached --quiet || git commit -m 'Remove temporary donation modal workflow'
          git push || true
