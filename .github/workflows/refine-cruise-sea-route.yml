name: Affine le trajet maritime
on: push
permissions:
  contents: write
jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tracer la croisière sur l’eau
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('templates/index.html')
          s=p.read_text(encoding='utf-8')
          old="var cruiseLine=L.polyline([points.Tromso,[69.655,19.02],[69.67,19.18],[69.72,19.38],[69.79,19.56],[69.84,19.72],points.Quest],{color:'#6d19d9',weight:4,lineCap:'round',lineJoin:'round'}).addTo(groups.cruise);"
          new="var cruiseLine=L.polyline([points.Tromso,[69.68,19.00],[69.72,19.08],[69.7789,19.1524],[69.82,19.30],[69.84,19.50],[69.86,19.70],points.Quest],{color:'#6d19d9',weight:4,lineCap:'round',lineJoin:'round'}).addTo(groups.cruise);"
          if old not in s: raise SystemExit('Trajet actuel introuvable')
          p.write_text(s.replace(old,new),encoding='utf-8')
          PY
      - name: Commit et supprimer le workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add templates/index.html .github/workflows/refine-cruise-sea-route.yml
          git commit -m "Affîne le trajet de la croisière sur l eau"
          git push
          git rm .github/workflows/refine-cruise-sea-route.yml
          git commit -m "Supprime le workflow temporaire"
          git push
