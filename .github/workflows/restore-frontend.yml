name: Restore frontend carousels
on:
  push:
    paths:
      - '.github/workflows/restore-frontend.yml'
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject frontend fix
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path
          p=Path('app.py')
          s=p.read_text(encoding='utf-8')
          if 'def restored_frontend_fixes' not in s:
              payload='...'
              code=base64.b64decode(payload).decode('utf-8')
              s=s.replace('def images_for(activity):\n',code+'\ndef images_for(activity):\n',1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit fix and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git commit -m "Restore carousels and activity choices"
          git push
          git rm .github/workflows/restore-frontend.yml
          git commit -m "Remove temporary frontend workflow"
          git push
