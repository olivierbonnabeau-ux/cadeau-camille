name: Restore stable site
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  restore:
    if: github.event.head_commit.message != 'Restaure la version stable du site'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore known-good template
        run: |
          git show 38ffeee003f23f349d6eeb0e73d445e0edb899ef:templates/index.html > templates/index.html
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('templates/index.html')
          s=p.read_text()
          s=re.sub(r'(?:<div class="warning-banner">.*?</div>\s*)+', '', s, flags=re.S)
          banner='<div class="warning-banner">⚠️ Attention, la surprise ne lui sera dévoilée que le 30 Septembre, ne pas vendre la mèche !</div>'
          s=s.replace('<header class="hero"><div class="wrap">','<header class="hero"><div class="wrap">'+banner,1)
          s=s.replace("objectif {{'%.0f'|format(goal_value)}} €","reste à charge pour Camille {{'%.0f'|format(goal_value)}} €")
          s=s.replace("Pas de paiement en ligne ici : faites simplement une promesse de don et laissez-lui un petit mot pour son anniversaire.<br>Vous pourrez ensuite <b>lui remettre directement votre participation</b>. ❤️","Pas de paiement en ligne ici : faites simplement une promesse de don et laissez-lui un petit mot pour son anniversaire.<br>Vous pourrez ensuite <b>lui remettre directement votre participation quand les détails du voyage seront définitifs</b>. ❤️")
          p.write_text(s)
          PY
      - name: Remove restore workflow and commit
        run: |
          rm -f .github/workflows/restore-stable-site.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add templates/index.html .github/workflows/restore-stable-site.yml
          git commit -m 'Restaure la version stable du site'
          git push
