name: Affiche tous les donateurs
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Modifier uniquement l'affichage des donateurs
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('app.py')
          s = app.read_text(encoding='utf-8')
          old = "messages = Pledge.query.filter(Pledge.public_message.is_(True), Pledge.message.isnot(None), Pledge.message != '').order_by(Pledge.created_at.desc()).limit(30).all()"
          new = "messages = Pledge.query.order_by(Pledge.created_at.desc()).limit(30).all()"
          assert old in s, 'Requête des messages introuvable : aucune modification appliquée à app.py'
          s = s.replace(old, new, 1)
          app.write_text(s, encoding='utf-8')

          tpl = Path('templates/index.html')
          s = tpl.read_text(encoding='utf-8')
          old = '<section><h2 class="sectiontitle">💌 Les petits mots pour Camille</h2><p class="intro">Les amis qui le souhaitent peuvent laisser un message pour Camille. Ces mots peuvent apparaître ici pendant la préparation du voyage.</p>{% if messages %}<div class="messages">{% for p in messages %}<article class="message"><div class="quote">{{p.message}}</div><div class="from">❤️ {{p.name}}</div>{% if p.activity %}<div class="tag">Sponsor de : {{p.activity.emoji}} {{p.activity.title}}</div>{% endif %}</article>{% endfor %}</div>{% else %}<div class="empty">Le premier petit mot pour Camille sera bientôt là… ❤️</div>{% endif %}</section>'
          new = '<section><h2 class="sectiontitle">💌 Les petits mots pour Camille</h2><p class="intro">Les personnes qui participent au cadeau apparaissent ici, même lorsqu’elles n’ont pas laissé de message. ❤️</p>{% if messages %}<div class="messages">{% for p in messages %}<article class="message"><div class="quote">{% if p.message %}{{p.message}}{% else %}Merci pour ta participation à cette belle aventure ! ❤️{% endif %}</div><div class="from">❤️ {{p.name}}</div>{% if p.activity %}<div class="tag">Sponsor de : {{p.activity.emoji}} {{p.activity.title}}</div>{% endif %}</article>{% endfor %}</div>{% else %}<div class="empty">Le premier participant au cadeau sera bientôt là… ❤️</div>{% endif %}</section>'
          assert old in s, 'Section des petits mots introuvable : aucune modification appliquée à index.html'
          s = s.replace(old, new, 1)
          tpl.write_text(s, encoding='utf-8')
          PY
      - name: Vérifier que la liste des promesses est intacte
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('app.py').read_text(encoding='utf-8')
          required=[
            "'Avion'",
            "'Tromsø'",
            "'Croisière Aurore Boréale et Safari Baleine'",
            "'Les îles Lofoten'",
            "\"S'endormir sous les aurores boréales dans des cabanes au bout du monde\"",
            "'Traversée Bodø → Moskenes'",
            "'Oslo'",
            "'Repas & gourmandises'",
          ]
          for x in required: assert x in s, f'Activité/promesse absente: {x}'
          assert 'PROMISES = {' in s, 'PROMISES introuvable'
          print('Liste des activités/promesses conservée.')
          PY
      - name: Commit puis supprimer le workflow temporaire
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py templates/index.html .github/workflows/show-all-donors.yml
          git commit -m 'Affiche tous les donateurs dans les petits mots'
          git rm .github/workflows/show-all-donors.yml
          git commit -m 'Supprime le workflow temporaire'
          git push
