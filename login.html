<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administration</title><style>body{font-family:system-ui;background:#081923;color:#fff;display:grid;place-items:center;min-height:100vh}.box{background:#102b39;padding:32px;border-radius:20px;width:min(420px,90%)}input,button{width:100%;padding:13px;margin-top:10px;border-radius:10px;border:1px solid #456;background:#081923;color:#fff}button{background:#d9f7ff;color:#08202c;font-weight:800;cursor:pointer}.err{color:#ffb0b0}</style><div class="box"><div style="font-size:12px;letter-spacing:.15em;text-transform:uppercase;color:#77d4ff;font-weight:800">Projet 70°NORD</div><h1>🔐 Administration</h1><p>Gestion des promesses du cadeau.</p>{% with messages=get_flashed_messages(with_categories=true) %}{% for c,m in messages %}<div class="err">{{m}}</div>{% endfor %}{% endwith %}<form method="post"><input name="password" type="password" placeholder="Mot de passe" autofocus required><button>Se connecter</button></form></div></html>
